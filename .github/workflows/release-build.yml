# Manual macOS and Windows builds. Start this from the Actions tab.
# It does not run on push or pull_request, and it does not publish a release.
# workflow_dispatch input `platform`: both (default), windows, or macos.
#
# Signed output needs the secrets documented in docs/macos-signing.md and
# docs/windows-signing.md. With those secrets unset, the jobs still build
# unsigned artifacts. On Windows, a missing WINDOWS_CERT_PFX_BASE64 skips
# Authenticode and the job summary says the installer is unsigned. A PFX
# without WINDOWS_CERT_PASSWORD still fails. The macOS job is unchanged.
name: Release build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which installer to build
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    if: ${{ github.event.inputs.platform != 'windows' }}
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build Stowe.app and DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-macos.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: stowe-macos
          path: Stowe-*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    if: ${{ github.event.inputs.platform != 'macos' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Empty WINDOWS_CERT_PFX_BASE64 (secret not set) is an unsigned build.
      # scripts/build-windows.ps1 records that in the job summary and still
      # exits 0. Do not require the PFX here.
      - name: Build Windows installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: .\scripts\build-windows.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: stowe-windows
          path: Stowe-*-windows-setup.exe
          if-no-files-found: error
